<div class="bootstrap-wrapper">

    <mat-card class="mt20">
        <h1 style="margin-top:40px;">Please complete your profile:</h1>
        <!-- {{loginData|json}} -->
        <form (ngSubmit)="formSubmit()">
            <div class="container">
            <div class="row">
                <div class="col-md-3 offset-md-3">
                        <mat-form-field class="full-width text-center" appearance="outline">

                            <mat-label>Specialized</mat-label>
                            <input
                            [(ngModel)]="doctor.specialized"
                            
                            name="specialized" matInput placeholder="Enter your specialization">
                            <mat-hint>Specialized</mat-hint>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field class="full-width text-center" appearance="outline">

                            <mat-label>Registration number</mat-label>
                            <input
                            [(ngModel)]="doctor.registrationNumber"
                            name="registrationNumber" matInput placeholder="Enter registration number">
                            <mat-hint>Registration number</mat-hint>
                        </mat-form-field>
                    </div>

                   </div>
                   <div class="row">
                    <div class="col-md-3 offset-md-3">
                            <mat-form-field class="full-width text-center" appearance="outline">
    
                                <mat-label>Contact</mat-label>
                                <input
                                [(ngModel)]="doctor.appointmentContact"
                                
                                name="specialized" matInput placeholder="Contact number for appointment">
                                <mat-hint>Appointment</mat-hint>
                            </mat-form-field>
                        </div>
                        <div class="col-md-6">
                            <mat-form-field class="full-width text-center" appearance="outline">
    
                                <mat-label>Degree</mat-label>
                                <input
                                [(ngModel)]="doctor.degree"
                                name="registrationNumber" matInput placeholder="Enter educational qualification">
                                <mat-hint>Degree</mat-hint>
                            </mat-form-field>
                        </div>
                        </div>
                   
            </div>
            <div class="btnMar">

                <button type="submit" mat-raised-button color="primary">Save</button>
            </div>
        </form>
    </mat-card>

</div>
