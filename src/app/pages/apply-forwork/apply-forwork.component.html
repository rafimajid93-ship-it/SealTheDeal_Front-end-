<div class="bootstrap-wrapper">
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <mat-card class="mt20">
                    <h1 class="text-center" style="margin-top:40px;">Job proposal</h1>
                    <!-- formSubmit is written in signup.ts
                ngSubmit is a event to submit
                 -->
                    <form (ngSubmit)="formSubmit()">
                        <mat-form-field class="full-width" appearance="outline">

                            <mat-label>Name</mat-label>
                            <input
                            [(ngModel)]="work.name"
                            name="name"
                            required matInput placeholder="Enter your name">

                        </mat-form-field>
                        <mat-form-field class="full-width" appearance="outline">
                            <mat-label>Description</mat-label>
                            <input
                            [(ngModel)]="work.description"
                            name="description"
                            required matInput placeholder="Enter password">

                        </mat-form-field>
                        

                        
                        
                        <div class="container text-center">

                            <button type="submit" mat-raised-button color="primary">Apply</button>
                        </div>
                    </form>
                </mat-card>
            </div>
        </div>
    </div>
</div>
