<mat-card class="mt10 mr20 ml20" *ngFor="let q of work" >
    
    <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>
            
            {{q.type}}
            
        </mat-card-title>
        <mat-card-subtitle>
           Salary : {{q.amount}}
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="ml55">
        <p>{{q.description}}</p>
    </mat-card-content>
    <button class="ml55" mat-flat-button color="primary">Contact With Employeer</button>
    <button mat-stroked-button color="primary" class="ml20">Message </button>
    <button mat-flat-button [routerLink]="'/user/applyWork/'+q.id" color="primary" class="ml20">Apply for the post</button>
    
</mat-card>
