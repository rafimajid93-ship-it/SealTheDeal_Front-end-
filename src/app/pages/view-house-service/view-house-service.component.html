<mat-card class="mt10 mr20 ml20" *ngFor="let q of services" >
    
    <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>
            
            {{q.agencyName}}
            
        </mat-card-title>
        <mat-card-subtitle>
            {{q.agencyContact}}
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="ml55">
        <p>{{q.description}}</p>
    </mat-card-content>
    <button class="ml55" mat-flat-button color="primary">Contact With Agency</button>
    <button mat-stroked-button color="primary" class="ml20">Message </button>
    <button mat-flat-button color="primary" (click)="houseService(q)" class="ml20">Take Service</button>
    
</mat-card>
