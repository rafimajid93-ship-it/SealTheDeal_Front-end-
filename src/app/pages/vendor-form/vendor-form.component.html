<div class="bootstrap-wrapper">

    <mat-card *ngIf="flag==='appartment'" class="mt20">
        <h1 style="margin-top:40px;">Apartment Details:</h1>
        <form (ngSubmit)="apartmentSubmit()">
            <div class="container">
            <div class="row">
                <div class="col-md-3 offset-md-3">
                        <mat-form-field class="full-width text-center" appearance="outline">
                            <mat-label>Address</mat-label>
                            <input
                            [(ngModel)]="apartment.address"
                            name="address" matInput placeholder="Enter apartment adress">
                            <mat-hint>Valid address</mat-hint>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field class="full-width text-center" appearance="outline">
                             <mat-label>Rent</mat-label>
                            <input
                            [(ngModel)]="apartment.rent"
                            name="shopDetails" matInput placeholder="Enter shop rent amount">
                            <mat-hint>Rent</mat-hint>
                        </mat-form-field>
                    </div>
                </div>
                   <div class="row">
                    <div class="col-md-3 offset-md-3">
                            <mat-form-field class="full-width text-center" appearance="outline">
                                <mat-label>Description</mat-label>
                                <input
                                [(ngModel)]="apartment.description"
                                name="address" matInput placeholder="Enter details">
                                <mat-hint>Description</mat-hint>
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            <div class="container text-center">
                <button type="submit" mat-raised-button color="primary">Submit</button>
            </div>
        </form>
    </mat-card>
  
</div>
