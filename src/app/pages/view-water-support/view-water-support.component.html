<div class="bootstrap-wrapper">
    <div class="mt20 container">
      <form (ngSubmit)="formSubmit()">
  <table mat-table [dataSource]="water" class="mat-elevation-z8">
  
    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->
  
    <!-- Position Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>
  
    <ng-container matColumnDef="agencyName">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.agencyName}} </td>
    </ng-container>
    <!-- Name Column -->
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef> Address </th>
      <td mat-cell *matCellDef="let element"> {{element.address}} </td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let element"> {{element.price}} </td>
    </ng-container>
    <ng-container matColumnDef="actions2">
      <th mat-header-cell *matHeaderCellDef> Quantity </th>
      <td mat-cell *matCellDef="let element"> 
        <mat-form-field class="w" appearance="outline">

          
          <input
          [(ngModel)]="waterConsumer.quantity"
          name="quantity"
          required matInput >

      </mat-form-field>
        <!-- <input name="qunatity" [ngModel]="waterConsumer.quantity" class="m20"/> -->
       </td>
    </ng-container>
    <!-- Symbol Column -->
    <ng-container matColumnDef="service_contact">
      <th mat-header-cell *matHeaderCellDef> Contact </th>
      <td mat-cell *matCellDef="let element"> {{element.service_contact}} </td>
    </ng-container>
    
    
   
  
    <ng-container matColumnDef="actions">
      <mat-header-cell class="mt20 ml20"  *matHeaderCellDef >  </mat-header-cell>
      <mat-cell *matCellDef="let row" >
           <button type="submit" (click)="waterOrder(row)" mat-button >Order</button>
      </mat-cell>
    </ng-container>

  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</form>
  </div>
  </div>
