<div class="bootstrap-wrapper">

    <mat-card class="mt20">
        <h1 style="margin-top:40px;">Please complete your profile:</h1>
        <!-- {{loginData|json}} -->
        <form (ngSubmit)="formSubmit()">
            <div class="container">
            <div class="row">
                <div class="col-md-3 offset-md-3">
                        <mat-form-field class="full-width text-center" appearance="outline">

                            <mat-label>Adress</mat-label>
                            <input
                            [(ngModel)]="consumer.address"
                            
                            name="address" matInput placeholder="Enter Username">
                            <mat-hint>Adress</mat-hint>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field class="full-width text-center" appearance="outline">

                            <mat-label>Profession</mat-label>
                            <input
                            [(ngModel)]="consumer.profession"
                            name="profession" matInput placeholder="Enter Username">
                            <mat-hint>Profession</mat-hint>
                        </mat-form-field>
                    </div>

                   </div>
                   
            </div>
            <div class="btnMar">

                <button type="submit" mat-raised-button color="primary">Save</button>
            </div>
        </form>
    </mat-card>

</div>
