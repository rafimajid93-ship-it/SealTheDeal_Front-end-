<div class="bootstrap-wrapper">
  <div class="mt20 container">
<table mat-table [dataSource]="doctor" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="appointmentContact">
    <th mat-header-cell *matHeaderCellDef> Contact </th>
    <td mat-cell *matCellDef="let element"> {{element.appointmentContact}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="specialized">
    <th mat-header-cell *matHeaderCellDef> Specialized </th>
    <td mat-cell *matCellDef="let element"> {{element.specialized}} </td>
  </ng-container>

  <ng-container matColumnDef="degree">
    <th mat-header-cell *matHeaderCellDef> Degree </th>
    <td mat-cell *matCellDef="let element"> {{element.degree}} </td>
  </ng-container>
  
  <ng-container matColumnDef="actions">
    <mat-header-cell class="mt20 ml20"  *matHeaderCellDef > Actions </mat-header-cell>
    <mat-cell *matCellDef="let row" >
         <button (click)="dAppoinment(row)" mat-button >Take Appoinment</button>
    </mat-cell>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

</div>
</div>
