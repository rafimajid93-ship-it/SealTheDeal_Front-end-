<div class="bootstrap-wrapper">

    <mat-card *ngIf="!flag" class="mt20">
        <h1 style="margin-top:40px;">Please complete your profile:</h1> -->
        <!-- {{loginData|json}} -->
        <form (ngSubmit)="formSubmit()">
            <div class="container">
            <div class="row">
                <div class="col-md-3 offset-md-3">
                        <mat-form-field class="full-width text-center" appearance="outline">

                            <mat-label>Shop name</mat-label>
                            <input
                            [(ngModel)]="vendor.shopName"
                            
                            name="shopName" matInput placeholder="Enter shop name">
                            <mat-hint>Valid name</mat-hint>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field class="full-width text-center" appearance="outline">

                            <mat-label>Shop Details</mat-label>
                            <input
                            [(ngModel)]="vendor.shopDetails"
                            name="shopDetails" matInput placeholder="Enter shop details">
                            <mat-hint>Details</mat-hint>
                        </mat-form-field>
                    </div>

                   </div>
                   <div class="row">
                    <div class="col-md-3 offset-md-3">
                            <mat-form-field class="full-width text-center" appearance="outline">
    
                                <mat-label>Address</mat-label>
                                <input
                                [(ngModel)]="vendor.address"
                                name="address" matInput placeholder="Enter address">
                                <mat-hint>Adress</mat-hint>
                            </mat-form-field>
                        </div>
                        <div class="col-md-6">
                            <mat-form-field class="full-width text-center" appearance="outline">
    
                                <mat-label>NID</mat-label>
                                <input 
                                [(ngModel)]="vendor.idPic"
                                name="idPic" matInput placeholder="Enter NID">
                                <mat-hint>National Id number</mat-hint>
                            </mat-form-field>
                        </div>
    
                       </div>
                       <div class="row">
                        <div class="col-md-3 offset-md-3">
                            <h4>Select type</h4>
                            <mat-form-field appearance="fill">
                                <mat-label>Vendor type</mat-label>
                                <mat-select [(value)]="vendor.type">
                                    <mat-option   value="water_supplier">Water Supplier</mat-option>
                                    <mat-option   value="house_service">House Service</mat-option>
                                    <mat-option   value="appartment">Appartment</mat-option>
                                    <mat-option   value="product">Product</mat-option>
                                    <mat-option   value="furniture">Furniture</mat-option>
                                </mat-select>
                            </mat-form-field>
                            </div>
                        </div>
                            <div class="row">
                            <div class="col-md-3 offset-md-3">
                                <input (change)="selectFile($event)" type="file"/>
                            </div>
                        </div>
        
                           
                   
            </div>
            <div class="btnMar">

                <button (click)="uploadFile()" type="submit" mat-raised-button color="primary">Save</button>
            </div>
        </form>
    </mat-card>

</div>
