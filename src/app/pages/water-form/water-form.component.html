<div class="bootstrap-wrapper">

    <mat-card class="mt20">
        <h1 style="margin-top:40px;">Apartment Details:</h1>
        <form (ngSubmit)="waterSubmit()">
            <div class="container">
            <div class="row">
                <div class="col-md-3 offset-md-3">
                    <mat-form-field class="full-width text-center" appearance="outline">
                         <mat-label>Agency name</mat-label>
                        <input
                        [(ngModel)]="water.agencyName"
                        name="agencyName" matInput placeholder="Enter Name">
                        <mat-hint>Name</mat-hint>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                        <mat-form-field class="full-width text-center" appearance="outline">
                            <mat-label>Address</mat-label>
                            <input
                            [(ngModel)]="water.address"
                            name="address" matInput placeholder="Enter apartment adress">
                            <mat-hint>Valid address</mat-hint>
                        </mat-form-field>
                    </div>
                    
                </div>
                   <div class="row">
                    <div class="col-md-3 offset-md-3">
                            <mat-form-field class="full-width text-center" appearance="outline">
                                <mat-label>Contact</mat-label>
                                <input
                                [(ngModel)]="water.service_contact"
                                name="address" matInput placeholder="Enter contact details">
                                <mat-hint>Contact</mat-hint>
                            </mat-form-field>
                        </div>
                        <div class="col-md-6">
                            <mat-form-field class="full-width text-center" appearance="outline">
                                 <mat-label>Price</mat-label>
                                <input
                                [(ngModel)]="water.price"
                                name="price" matInput placeholder="Enter price">
                                <mat-hint>Price</mat-hint>
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            <div class="container text-center">
                <button type="submit" mat-raised-button color="primary">Submit</button>
            </div>
        </form>
    </mat-card>
  
</div>
