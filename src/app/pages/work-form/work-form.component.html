<div class="bootstrap-wrapper">

    <mat-card  class="mt20">
        <h1 style="margin-top:40px;">Product Details:</h1>
        <form (ngSubmit)="formSubmit()">
            <div class="container">
            <div class="row">
                <div class="col-md-3 offset-md-3">
                        <mat-form-field class="full-width text-center" appearance="outline">
                            <mat-label>Type</mat-label>
                            <input
                            [(ngModel)]="work.type"
                            name="type" matInput placeholder="Enter type">
                            <mat-hint>Type</mat-hint>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field class="full-width text-center" appearance="outline">
                             <mat-label>Salary</mat-label>
                            <input
                            [(ngModel)]="work.amount"
                            name="price" matInput placeholder="Enter salary">
                            <mat-hint>Salary</mat-hint>
                        </mat-form-field>
                    </div>
                </div>
                   <div class="row">
                    <div class="col-md-3 offset-md-3">
                        <mat-form-field class="full-width text-center" appearance="outline">
                            <mat-label>Description</mat-label>
                            <input
                            [(ngModel)]="work.description"
                            name="description" matInput placeholder="Enter description">
                            <mat-hint>Description</mat-hint>
                        </mat-form-field>
                    </div>
                    
                        
                    </div>
                   
                </div>
            <div class="container text-center">
                <button type="submit" mat-raised-button color="primary">Submit</button>
            </div>
        </form>
    </mat-card>
  
</div>
